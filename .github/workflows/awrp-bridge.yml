name: awrp-bridge
on:
  push:
    branches: [main]
    paths:
      - 'bridge/requests/*.json'
      - '!bridge/requests/*.result.json'
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure bridge commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Process new bridge requests through the validated composer
        run: |
          set -euo pipefail
          python tools/awrp.py bridge-process --root . --all-pending --remote origin --branch main
